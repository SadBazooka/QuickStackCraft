name: Bug report
description: Report a bug, crash, or items going somewhere they shouldn't
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please **search existing issues** first, and make sure you're on the
        latest version of the mod. The more detail you give (especially a log link), the faster this
        can be fixed.

  - type: input
    id: mod-version
    attributes:
      label: QuickStack & Craft version
      placeholder: "e.g. 0.1.3"
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      value: "1.21.1"
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      placeholder: "e.g. 21.1.77"
    validations:
      required: true

  - type: input
    id: modpack
    attributes:
      label: Modpack (if any)
      placeholder: "e.g. All the Mods 10 (ATM10), or 'none'"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which feature is affected?
      options:
        - Quick Stack
        - Dump All
        - Craft from Nearby (JEI)
        - Sophisticated Backpacks buttons
        - Storage targeting (items going to the wrong block / not a valid target)
        - Favorites
        - Config / keybinds / commands
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happens.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log / crash report
      description: >
        Upload your `logs/latest.log` (and the crash report, if the game crashed) to a
        [Gist](https://gist.github.com) or paste site and link it here. Please **don't** paste the
        whole log inline.
      placeholder: "https://gist.github.com/..."
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Relevant other mods & versions
      description: e.g. Sophisticated Backpacks/Storage, JEI, Functional Storage — with versions if you can.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't already been reported.
          required: true
        - label: I'm on the latest version of the mod.
          required: true
