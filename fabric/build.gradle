plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Loader-suffixed jar name, e.g. quickstackcraft-fabric-0.1.3+1.21.1.jar
base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }              // Cloth Config
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Architectury API (Fabric)
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    // JEI (compile-only)
    modCompileOnlyApi "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"

    // Sophisticated Backpacks + Core (Fabric port), compile-only soft dependency for the backpack
    // stack/dump buttons. These are intermediary-mapped mod jars, so use modCompileOnly to let Loom
    // remap them to named mappings for compilation. Not redistributed (gitignored).
    modCompileOnly files("libs/sophisticatedbackpacks-1.21.1-3.23.4.3.106.jar")
    modCompileOnly files("libs/sophisticatedcore-1.21.1-1.2.9.21.168.jar")

    // Cloth Config + Mod Menu (optional): an in-game config screen. Compile-only + guarded at
    // runtime, so the mod works without them (the built-in JSON config is always active).
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    modCompileOnly "com.terraformersmc:modmenu:11.0.4"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
