modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "quickstackcraft-common.mixins.json"

[[mixins]]
config = "quickstackcraft.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

# Optional: Sophisticated Backpacks/Core integration (backpack stack/dump). Load after it so
# our soft-compat mixin's target class is present when present.
[[dependencies.${mod_id}]]
modId = "sophisticatedcore"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
